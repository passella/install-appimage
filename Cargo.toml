[package]
name = "install-appimage"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Install, update, list, verify, diagnose, and cleanly uninstall AppImages on Linux with user-level XDG integration"
repository = "https://github.com/passella/install-appimage"

[dependencies]
anyhow = "1.0"
backhand = { version = "0.25.5", default-features = false, features = ["gzip", "xz", "zstd", "lz4", "error-strings"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
hex = "0.4"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.15"
thiserror = "2.0"
